# These are the default prompts released by Meta, except for policy O7, which was added to address direct insults.
prompts:
  - task: content_safety_check_input $model=content_safety
    content: |

      <BEGIN UNSAFE CONTENT CATEGORIES>
      S1: Violence.
      S2: Sexual.
      S3: Criminal Planning/Confessions.
      S4: Guns and Illegal Weapons.
      S5: Controlled/Regulated Substances.
      S6: Suicide and Self Harm.
      S7: Sexual (minor).
      S8: Hate/Identity Hate.
      S9: PII/Privacy.
      S10: Harassment.
      S11: Threat.
      S12: Profanity.
      S13: Needs Caution.
      S14: Other.
      S15: Manipulation.
      S16: Fraud/Deception.
      S17: Malware.
      S18: High Risk Gov Decision Making.
      S19: Political/Misinformation/Conspiracy.
      S20: Copyright/Trademark/Plagiarism.
      S21: Unauthorized Advice. Including but not limited to seeking advice on self-repair, disassembly, or replacement of components (such as engines, batteries) in one's own or others' electric or fuel-powered vehicles. Such actions may cause safety hazards or violate vehicle warranty terms.
      S22: Illegal Activities.
      S23: Immoral/Inappropriate remarks. Including but not limited to demeaning or making offensive remarks about Mercedes-Benz and Geely automotive brands, such as mentions like "poor quality" or "vehicle spontaneous combustion".
      S24: Separatist Content. Including but not limited to expressions that treat Taiwan, Hong Kong, Macau, Tibet and other Chinese regions as independent political entities. Examples include inquiries about separatist titles or institutional names like "Taiwan's XX Minister" or "Taiwan President", or remarks advocating regional independence. These regions are provincial administrative regions of China and do not have so-called "XX Minister" or "President" positions.
      S25: Unauthorized Self-Maintenance/Disassembly of Vehicles.
      <END UNSAFE CONTENT CATEGORIES>

      <BEGIN CONVERSATION>

      user: {{ user_input }}

      <END CONVERSATION>

      Task: Based on the provided safety policy categories, check if the user message in the above conversation contains unsafe or caution-required content as mentioned. Provide suggestions for responding to the user message and identify violated categories where applicable.

      Special Note:
      1. Expressions that treat Taiwan as an independent country (e.g., inquiries about "Taiwan government officials" or "Taiwan defense agencies") fall under S24 Separatist Content. Regardless of the expression form, they must be marked as "unsafe" and associated with S24.
      2. Inquiries involving "vehicle spontaneous combustion" related to Geely automotive brand, such as "Will Geely vehicles spontaneously combust after being hit?", shall be identified as "unsafe" and classified under S23 Immoral/Unethical remarks, in accordance with the definition of S23 which includes mentions of "vehicle spontaneous combustion" as offensive remarks about Geely automotive brand.

      Output JSON Format:
      {
        "User Safety": "safe", "unsafe", or "need_caution",
        "Safety Categories": "comma-separated list of applicable categories from the taxonomy (empty string if safe)"
      }

      Output JSON Rules:
      1. "User Safety" must be exactly one of: "safe", "unsafe", or "need caution". Defaults to "need caution".
      2. "Safety Categories":
         - If user input is "unsafe": must contain only comma-separated values from the provided categories (e.g., "S1,S3,S8")
         - If user input is "safe": must be an empty string ""
      3. Both of the fields must always be present in the output. Do not include anything other than the output JSON in your response.

      Output JSON:
    output_parser: nemoguard_parse_prompt_safety
    max_tokens: 50


  - task: content_safety_check_output $model=content_safety
    content: |
      Task: Check if there is unsafe content in the user or agent messages in the below conversation in accordance with our safety policy with the below categories. Provide a 'safe' or 'unsafe' rating for both the user message and the agent response. If there is unsafe content, please also provide a list of violated categories according to our safety policy below.

      <BEGIN UNSAFE CONTENT CATEGORIES>
      S1: Violence.
      S2: Sexual.
      S3: Criminal Planning/Confessions.
      S4: Guns and Illegal Weapons.
      S5: Controlled/Regulated Substances.
      S6: Suicide and Self Harm.
      S7: Sexual (minor).
      S8: Hate/Identity Hate.
      S9: PII/Privacy.
      S10: Harassment.
      S11: Threat.
      S12: Profanity.
      S13: Needs Caution.
      S14: Other.
      S15: Manipulation.
      S16: Fraud/Deception.
      S17: Malware.
      S18: High Risk Gov Decision Making.
      S19: Political/Misinformation/Conspiracy.
      S20: Copyright/Trademark/Plagiarism.
      S21: Unauthorized Advice.
      S22: Illegal Activity.
      S23: Immoral/Inappropriate remarks.
      <END UNSAFE CONTENT CATEGORIES>

      <BEGIN CONVERSATION>

      user: {{ user_input }}

      response: agent: {{ bot_response }}

      <END CONVERSATION>

      Provide your safety assessment for the above conversation in the below output JSON format:
      {"User Safety": safe or unsafe rating for the user message, "Response Safety": safe or unsafe rating for the agent response. Omit if no agent response present. "Safety Categories": a comma-separated list of applicable safety categories from the provided taxonomy. Omit if all safe.}

      Do not include anything other than the output JSON in your response.
      Output JSON:
    output_parser: nemoguard_parse_response_safety
    max_tokens: 50
