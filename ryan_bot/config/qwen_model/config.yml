models:
- type: main
  engine: ryan_vllm_engine
  model: Qwen2.5-7B-Instruct
  parameters:
    model_path: /home/ryan_niu/ryan/llm/models/Qwen2.5-7B-Instruct
    checkpoint_path: ''
    device: cuda
streaming: true
custom_data:
  sensitive_words_file: ./resources/sensitive_words.txt
  profanity_words_file: ./resources/profanity_words.txt
rails:
  input:
    flows:
      - input rails
  output:
    flows:
      - output rails
  dialog:
    single_call:
      enabled: false
      fallback_to_multiple_calls: true
    user_messages:
      embeddings_only: false
      embeddings_only_similarity_threshold: 0.70
core:
  embedding_search_provider:
    name: default
    parameters:
      embedding_engine: SentenceTransformers
      embedding_model: sentence-transformers/all-MiniLM-L6-v2
      use_batching: false
      max_batch_size: 10
      max_batch_hold: 0.01
      search_threshold: 0.7
    cache:
      enabled: false
      key_generator: sha256
      store: filesystem
      store_config:
        cache_dir: ./cache/embeddings
knowledge_base:
  embedding_search_provider:
    name: default
    parameters:
      embedding_engine: FastEmbed
      embedding_model: all-MiniLM-L6-v2
      use_batching: false
      max_batch_size: 10
      max_batch_hold: 0.01
      search_threshold: 0.7
    cache:
      enabled: true
      key_generator: sha256
      store: filesystem
      store_config:
        cache_dir: ./cache/embeddings
