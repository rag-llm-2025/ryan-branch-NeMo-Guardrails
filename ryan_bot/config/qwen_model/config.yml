models:
- type: main
  engine: ryan_vllm_engine
  model: Qwen2.5-7B-Instruct
  parameters:
    model_path: /home/ryan_niu/ryan/llm/models/Qwen2.5-7B-Instruct
    checkpoint_path: ''
    device: cuda
streaming: true
stream_interval: 2
custom_data:
  sensitive_words_file: ./resources/sensitive_words.txt
  profanity_words_file: ./resources/profanity_words.txt
  level: ${LOG_LEVEL:-DEBUG}
  disabled: false
rails:
  input:
    flows:
    - input rails
  dialog:
    single_call:
      enabled: false
      fallback_to_multiple_calls: true
    user_messages:
      embeddings_only: false
