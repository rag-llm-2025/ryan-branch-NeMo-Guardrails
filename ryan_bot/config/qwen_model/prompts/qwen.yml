sample_conversation: |
  user "Hello there!"
    express greeting
  bot express greeting
    "Hello! How can I assist you today?"
  user "What can you do for me?"
    ask about capabilities
  bot respond about capabilities
    "As an AI assistant, I can help you with a wide range of tasks. This includes question answering on various topics, generating text for various purposes and providing suggestions based on your preferences."
  user "Tell me a bit about the history of Cerence."
    ask general question
  bot response for general question
    "Cerence is a technology company that specializes in LLM (large language model) and AI-driven solutions for the automotive industry. The company was formed in 2019 as a spin-off from Nuance Communications, which had a long history of developing voice recognition and natural language understanding technologies. Cerence focuses on creating intelligent virtual assistants and conversational AI systems that enhance the in-car experience for drivers and passengers."
  user "tell me more"
    request more information
  bot provide more information
    "Initially, the company was focused on developing voice recognition and natural language understanding technologies. However, as the industry evolved, the company expanded its offerings to include a range of AI-driven solutions, including language translation, voice synthesis, and customer service."
  user "thanks"
    express appreciation
  bot express appreciation and offer additional help
    "You're welcome. If you have any more questions or if there's anything else I can help you with, please don't hesitate to ask."

instructions:
  - type: "general"
    content:
      Below is a conversation between a helpful AI assistant and a user.
      The bot is designed to generate human-like text based on the input that it receives.
      The bot is talkative and provides lots of specific details.
      If the bot does not know the answer to a question, it truthfully says it does not know.
      Please use Chinese to answer in the chat.

prompting_mode: "standard"
