models:
  - type: main
    engine: openai
    model: Qwen/Qwen2.5-7B-Instruct
    parameters:
      base_url: http://gn401.crg.cerence.net:8010/v1
      api_key: sk-xxx   # 随便写一个字符串即可
      temperature: 0.1
      # max_tokens: 100
      top_p: 0.9
  - type: content_safety
    engine: openai
    model: Qwen/Qwen2.5-7B-Instruct
    parameters:
      base_url: http://gn401.crg.cerence.net:8010/v1
      api_key: sk-xxx   # 随便写一个字符串即可
      temperature: 0.1
      max_tokens: 100
      top_p: 0.9

streaming: True

rails:
  input:
    flows:
      - content safety check input $model=content_safety
  output:
    flows:
      - content safety check output $model=content_safety
